name: 🐛 Bug Report
description: Report a bug, rendering defect, CLI failure, or audio desync in REA
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! 
        Before submitting, please make sure you've tested with the latest version of `antigravity-remotion-skills` / `rea`.

  - type: input
    id: version
    attributes:
      label: REA / Remotion Version
      description: What version of REA and Remotion are you running? (Run `rea --version` or check `package.json`)
      placeholder: "REA v2.2.0-rc.1 / Remotion v4.0.543"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component / Engine
      description: Which part of the REA engine encountered the defect?
      options:
        - "CLI Tooling (rea cut, rea probe, rea render, rea validate)"
        - "Neural Vision (rea upscale, rea upscale-4k, RIFE, Real-ESRGAN)"
        - "Audio & Sonic Engine (rea sfx, rea pick-track, EBU R128 loudness)"
        - "TTS Voiceover (Gemini 3.8 Flash TTS / Edge-TTS)"
        - "Antigravity Agent Skills & Rules (.gemini/config/skills/remotion-dastras)"
        - "Art Director QA Loop (rea art-director)"
        - "Motion Graphics & Visual Plugins (Kinetic typography, overlays, shaders)"
        - "Scaffolding Package (create-remotion-antigravity)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System & Environment
      options:
        - "Windows 11 / 10"
        - "macOS (Apple Silicon M-Series)"
        - "macOS (Intel)"
        - "Ubuntu / Debian Linux"
        - "Docker / Headless CI Runner"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When running rea upscale-4k with ..., the rendering pipeline fails with ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we or an autonomous Antigravity agent reproduce this?
      placeholder: |
        1. Run command 'rea ...'
        2. Inspect output in '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: "Video renders at 60fps without frame loss or audio desync."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs & Error Output
      description: Paste any relevant console output, stack traces, or FFmpeg telemetry.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Validation Checklist
      options:
        - label: I have verified that this issue is reproducible on the latest release.
          required: true
        - label: I have checked existing issues to avoid filing a duplicate.
          required: true
