<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2D6A4F" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#D8F3DC" stroke-width="1.5" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Cutting Mat Background -->
  <rect width="1920" height="1080" fill="#1B4332"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Angle Guidelines -->
  <line x1="960" y1="540" x2="1920" y2="0" stroke="#D8F3DC" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>
  <line x1="960" y1="540" x2="1920" y2="1080" stroke="#D8F3DC" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>
  <line x1="960" y1="540" x2="0" y2="0" stroke="#D8F3DC" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>
  <line x1="960" y1="540" x2="0" y2="1080" stroke="#D8F3DC" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>

  <!-- Grid Coordinate Marks -->
  <circle cx="960" cy="540" r="8" fill="none" stroke="#D8F3DC" stroke-width="2" opacity="0.7"/>
  <text x="960" y="570" font-family="monospace" font-size="16" fill="#D8F3DC" opacity="0.5" text-anchor="middle">REA CRAFT CUTTING MAT // 16 FPS</text>
</svg>
