<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Glowing Developer Terminal Prompt Cursor -->
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Prompt Chevron > -->
  <path d="M22 26 L48 50 L22 74" stroke="#00F5FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
  <!-- Terminal Block Cursor -->
  <rect x="56" y="28" width="22" height="44" rx="4" fill="#00F5FF" filter="url(#cyanGlow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
